# Prueba el APK en un emulador de Android y guarda el registro (logcat) y capturas de pantalla.
# Sirve para encontrar por qué el juego se cierra en el celular. Se arma para x86_64 (la del emulador).
name: Prueba Android (emulador)

on:
  push:
    branches: [version-android]
  workflow_dispatch:

concurrency:
  group: android-prueba-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config zlib1g-dev libncurses-dev \
            cmake libffi-dev libssl-dev zip unzip ccache libltdl-dev
          pip install buildozer cython

      - name: Preparar carpeta (solo x86_64)
        run: |
          python herramientas/preparar_android.py
          sed -i 's/^android.archs = .*/android.archs = x86_64/' build_android/buildozer.spec

      - name: Cache de buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            build_android/.buildozer
          key: buildozer-x86_64-${{ hashFiles('android/buildozer.spec', 'android/recipes/**') }}-v1

      - name: Compilar APK x86_64
        working-directory: build_android
        run: |
          set -o pipefail
          buildozer android debug < /dev/null > buildozer.log 2>&1 || { tail -n 200 buildozer.log; exit 1; }
          ls -la bin

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: bash herramientas/probar_en_emulador.sh

      - name: Mostrar el registro
        if: always()
        run: |
          grep -iE "python|SDL|pygame|AndroidRuntime|FATAL|DEBUG  |libc|crash|Error" prueba/logcat.txt | tail -n 250 || true

      - name: Subir registro y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-emulador
          path: prueba/
