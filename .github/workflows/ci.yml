name: CI

on:
  push:
    branches: ["main", "version-android", "feat/**", "fix/**"]
  pull_request:
    branches: ["main", "version-android"]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce Pillow

      - name: Run automated verification suite
        run: python tests/verificar_proyecto.py
