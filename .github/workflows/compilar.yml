# Compila el juego en Windows automáticamente (GitHub Actions).
#
# - Cada vez que subís cambios, GitHub arma el .exe y lo deja para descargar en la pestaña
#   "Actions" > (la ejecución) > "Artifacts" > FNAF_Industrial-windows.
# - Si creás una etiqueta que empiece con "v" (por ejemplo v1.1), además publica una
#   "Release" con el zip listo para compartir.
# - También se puede lanzar a mano desde Actions > "Compilar juego (Windows)" > "Run workflow".
name: Compilar juego (Windows)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Revisar que el código no tenga errores de sintaxis
        run: python -m compileall -q .

      - name: Compilar el .exe
        run: pyinstaller --clean --noconfirm --onefile --noconsole --name FNAF_Industrial --icon icono.ico --add-data "assets;assets" fnaf_fabrica.py

      - name: Probar que el juego arranca (25 segundos, sin ventana ni sonido)
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = "dummy"
          $env:SDL_AUDIODRIVER = "dummy"
          $p = Start-Process -FilePath "dist\FNAF_Industrial.exe" -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) {
            Write-Error "El juego se cerró solo al arrancar (código $($p.ExitCode))."
            exit 1
          }
          Stop-Process -Name "FNAF_Industrial" -Force -ErrorAction SilentlyContinue
          Write-Host "El juego arrancó y siguió funcionando."

      - name: Armar el zip
        shell: pwsh
        run: |
          $nombre = if ("${{ github.ref_type }}" -eq "tag") { "FNAF_Industrial_${{ github.ref_name }}" } else { "FNAF_Industrial" }
          New-Item -ItemType Directory -Path $nombre | Out-Null
          Copy-Item "dist\FNAF_Industrial.exe" $nombre
          Copy-Item "publicacion\LEEME.txt" $nombre
          Compress-Archive -Path $nombre -DestinationPath "$nombre.zip"
          "ZIP=$nombre.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Guardar el zip para descargar
        uses: actions/upload-artifact@v4
        with:
          name: FNAF_Industrial-windows
          path: ${{ env.ZIP }}
          retention-days: 30

      - name: Publicar Release (solo con etiquetas v*)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
